spring.application.name=badfit-api

# Conexão via Pooler do Supabase (Porta 6543 para driblar bloqueios de IPv6/Firewall)
spring.datasource.url=jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.zoyzqtaxcmribebfqnms
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do JPA / Hibernate (ddl-auto=none evita travamento ao consultar metadados)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Desativa execução automática de scripts SQL e console H2
spring.sql.init.mode=never
spring.h2.console.enabled=false